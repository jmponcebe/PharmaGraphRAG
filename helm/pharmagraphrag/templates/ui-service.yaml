{{- if .Values.ui.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-ui
  labels:
    {{- include "pharmagraphrag.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
  {{- if eq .Values.ui.service.type "LoadBalancer" }}
  annotations:
    cloud.google.com/load-balancer-type: "External"
  {{- end }}
spec:
  type: {{ .Values.ui.service.type }}
  ports:
    - port: {{ .Values.ui.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "pharmagraphrag.selectorLabels" (dict "Chart" .Chart "Release" .Release "component" "ui") | nindent 4 }}
{{- end }}

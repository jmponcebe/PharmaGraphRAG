# Example Secret manifest. DO NOT commit real values.
#
# Apply with real values via:
#   kubectl create secret generic pharmagraphrag-secrets \
#     --namespace=pharmagraphrag \
#     --from-literal=GEMINI_API_KEY=$GEMINI_API_KEY \
#     --from-literal=NEO4J_URI=$NEO4J_URI \
#     --from-literal=NEO4J_PASSWORD=$NEO4J_PASSWORD \
#     --from-literal=LANGFUSE_PUBLIC_KEY=$LANGFUSE_PUBLIC_KEY \
#     --from-literal=LANGFUSE_SECRET_KEY=$LANGFUSE_SECRET_KEY
#
# Or use external-secrets-operator / GCP Secret Manager in production.
apiVersion: v1
kind: Secret
metadata:
  name: pharmagraphrag-secrets
  namespace: pharmagraphrag
type: Opaque
stringData:
  GEMINI_API_KEY: "REPLACE_ME"
  NEO4J_URI: "neo4j+s://REPLACE_ME.databases.neo4j.io"
  NEO4J_PASSWORD: "REPLACE_ME"
  LANGFUSE_PUBLIC_KEY: ""
  LANGFUSE_SECRET_KEY: ""

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pharmagraphrag
resources:
  - namespace.yaml
  - configmap.yaml
  - api-deployment.yaml
  - api-service.yaml
  - api-hpa.yaml
  - ui-deployment.yaml
  - ui-service.yaml
  - ui-hpa.yaml
  # secret.example.yaml is intentionally excluded — create the real
  # secret out-of-band with `kubectl create secret` (see secret.example.yaml).
  # ingress.yaml is opt-in — uncomment if you have a domain.

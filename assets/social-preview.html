<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1280px;
    height: 640px;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, #0a1e14 0%, #0c1a1e 30%, #0a1628 70%, #0d1117 100%);
    color: #e6edf3;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    overflow: hidden;
    position: relative;
  }

  /* Decorative gradient orbs */
  body::before {
    content: '';
    position: absolute;
    top: -80px;
    left: 80px;
    width: 550px;
    height: 550px;
    background: radial-gradient(circle, rgba(5, 150, 105, 0.15) 0%, transparent 60%);
    border-radius: 50%;
  }
  body::after {
    content: '';
    position: absolute;
    bottom: -100px;
    right: 60px;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(16, 185, 129, 0.10) 0%, transparent 60%);
    border-radius: 50%;
  }

  .content {
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 80px;
  }

  .title {
    font-size: 84px;
    font-weight: 900;
    letter-spacing: -4px;
    line-height: 1;
    margin-bottom: 20px;
  }
  .title .pharma {
    background: linear-gradient(135deg, #059669, #34d399);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .title .graphrag {
    background: linear-gradient(135deg, #e2e8f0, #f8fafc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subtitle {
    font-size: 24px;
    color: #94a3b8;
    margin-bottom: 40px;
    line-height: 1.4;
    font-weight: 400;
    max-width: 1000px;
    white-space: nowrap;
  }

  .tags {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-bottom: 36px;
  }
  .tag {
    background: rgba(139, 92, 246, 0.10);
    border: 1px solid rgba(139, 92, 246, 0.22);
    color: #c4b5fd;
    padding: 8px 20px;
    border-radius: 24px;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }

  .pipeline {
    display: flex;
    align-items: center;
    gap: 0;
  }
  .stage {
    background: rgba(52, 211, 153, 0.10);
    border: 1px solid rgba(52, 211, 153, 0.20);
    color: #a7f3d0;
    padding: 10px 22px;
    font-size: 15px;
    font-weight: 700;
    white-space: nowrap;
    letter-spacing: 0.3px;
  }
  .stage:first-child { border-radius: 8px 0 0 8px; }
  .stage:last-child { border-radius: 0 8px 8px 0; }
  .arrow {
    color: rgba(52, 211, 153, 0.5);
    font-size: 18px;
    margin: 0 -1px;
    z-index: 2;
  }

  .author {
    position: absolute;
    bottom: 22px;
    font-size: 15px;
    color: #475569;
    font-weight: 500;
    z-index: 1;
  }
</style>
</head>
<body>

<div class="content">
  <div class="title">
    <span class="pharma">Pharma</span><span class="graphrag">GraphRAG</span>
  </div>
  <div class="subtitle">
    Drug interactions & adverse events powered by GraphRAG + FDA data
  </div>

  <div class="tags">
    <span class="tag">Neo4j</span>
    <span class="tag">ChromaDB</span>
    <span class="tag">Gemini API</span>
    <span class="tag">FastAPI</span>
    <span class="tag">Streamlit</span>
    <span class="tag">Docker</span>
  </div>

  <div class="pipeline">
    <div class="stage">FAERS</div>
    <span class="arrow">→</span>
    <div class="stage">Graph</div>
    <span class="arrow">→</span>
    <div class="stage">Vectors</div>
    <span class="arrow">→</span>
    <div class="stage">Retrieve</div>
    <span class="arrow">→</span>
    <div class="stage">Generate</div>
    <span class="arrow">→</span>
    <div class="stage">Answer</div>
  </div>
</div>

<div class="author">github.com/jmponcebe/PharmaGraphRAG</div>

</body>
</html>

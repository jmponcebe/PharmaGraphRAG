# CD Pipeline — Build & Deploy to Google Cloud Run
# Triggers on version tags (v*) after CI passes

name: CD - Deploy to Cloud Run

on:
  push:
    tags:
      - 'v*'

env:
  PROJECT_ID: pharmagraphrag
  REGION: us-central1
  SERVICE: pharmagraphrag-api
  IMAGE: gcr.io/pharmagraphrag/pharmagraphrag-api

jobs:
  # Run tests first to ensure quality
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and deploy via Cloud Build
        run: |
          gcloud builds submit \
            --config=cloudbuild.yaml \
            --substitutions=_TAG=${{ github.ref_name }} \
            --project=${{ env.PROJECT_ID }} \
            --timeout=1800s \
            .

      - name: Show deployment URL
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE }} \
            --region=${{ env.REGION }} \
            --format='value(status.url)')
          echo "Deployed to: $URL"
          echo "Image tag: ${{ github.ref_name }}"

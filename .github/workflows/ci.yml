name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------
# Job 1 — Lint, type-check, and test
# ---------------------------------------------------------------
jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint with Ruff
        run: |
          uv run ruff check src/ tests/
          uv run ruff format --check src/ tests/

      - name: Type check with MyPy
        run: uv run mypy src/
        continue-on-error: true

      - name: Run tests with coverage
        run: uv run pytest --tb=short --cov=pharmagraphrag --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ---------------------------------------------------------------
  # Job 0 — Detect whether Docker-relevant files changed
  # ---------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
      helm: ${{ steps.filter.outputs.helm }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docker:
              - 'docker/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'requirements.txt'
              - '.github/workflows/ci.yml'
            helm:
              - 'helm/**'
              - 'k8s/**'
              - '.github/workflows/ci.yml'

  # ---------------------------------------------------------------
  # Job 3 — Validate Helm chart and K8s manifests
  # ---------------------------------------------------------------
  helm-validate:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Helm lint
        run: helm lint helm/pharmagraphrag

      - name: Helm template (default values)
        run: helm template demo helm/pharmagraphrag --namespace pharmagraphrag > /tmp/rendered.yaml

      - name: Install kubeconform
        run: |
          curl -L -o kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate rendered manifests against K8s schema
        run: kubeconform -strict -ignore-missing-schemas -schema-location default /tmp/rendered.yaml

      - name: Validate raw k8s/ manifests
        run: |
          # Skip the example secret file
          for f in k8s/*.yaml; do
            [[ "$f" == *secret.example.yaml ]] && continue
            kubeconform -strict -ignore-missing-schemas -schema-location default "$f"
          done

  # ---------------------------------------------------------------
  # Job 2 — Build Docker images (only when Docker-relevant files change)
  # ---------------------------------------------------------------
  docker-build:
    runs-on: ubuntu-latest
    needs: [lint-and-test, changes]
    if: >
      needs.changes.outputs.docker == 'true' ||
      contains(github.event.head_commit.message, '[docker]')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: false
          tags: pharmagraphrag-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build UI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.ui
          push: false
          tags: pharmagraphrag-ui:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
